{%- assign p = site.data.profile -%}
<header class="nav-wrap">
  <nav class="nav" aria-label="메인 메뉴">
    <a class="nav-brand" href="{{ '/' | relative_url }}">
      <img src="{{ p.avatar | relative_url }}" alt="" width="28" height="28">
      <span>{{ p.handle }}</span>
    </a>
    <span class="nav-sep" aria-hidden="true"></span>
    <ul class="nav-links">
      <li><a href="{{ '/posts/' | relative_url }}" {% if page.url == '/posts/' %}aria-current="page"{% endif %}>Posts</a></li>
      <li class="nav-cat">
        <button type="button" class="nav-cat-btn" aria-expanded="false" aria-controls="cat-menu">Categories</button>
        <ul class="nav-cat-menu" id="cat-menu">
          {%- for c in site.data.categories %}
          {%- assign n = site.categories[c.key] | size %}
          <li><a href="{{ '/' | append: c.key | append: '/' | relative_url }}"><span>{{ c.name }}</span><em>{{ n }}</em></a></li>
          {%- endfor %}
        </ul>
      </li>
      <li><a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a></li>
    </ul>
    <span class="nav-sep" aria-hidden="true"></span>
    <button type="button" class="icon-btn" data-search-open aria-label="글 검색 (Ctrl+K)">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button type="button" class="icon-btn" data-theme-toggle aria-label="다크 모드 전환">
      <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </nav>
</header>
